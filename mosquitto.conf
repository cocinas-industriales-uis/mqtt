# ================================================================
# mosquitto.conf — Broker MQTT para Sistema IoT Cocinas
# Universidad Industrial de Santander (UIS) — 2026
#
# Ubicación recomendada: /etc/mosquitto/mosquitto.conf
# Iniciar: sudo systemctl start mosquitto
# ================================================================

# Puerto estándar MQTT
listener 1883

# Acepta conexiones sin autenticación (desarrollo local)
# En producción cambiar a: password_file /etc/mosquitto/passwd
allow_anonymous true

# Logging
log_type error
log_type warning
log_type notice
log_type information
log_dest file /var/log/mosquitto/mosquitto.log

# Persistencia — guarda mensajes entre reinicios
persistence true
persistence_location /var/lib/mosquitto/

# Keep-alive máximo
max_keepalive 60

# Tamaño máximo de mensaje (256 KB — suficiente para JSON de sensores)
message_size_limit 262144
